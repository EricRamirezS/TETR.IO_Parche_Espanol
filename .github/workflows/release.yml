name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64,    artifact: tetrio-es-patcher-windows-x64.exe }
          # macos-13 se retiro (dic. 2025); macos-15-intel es el reemplazo para Intel x64.
          - { os: macos-15-intel,   rid: osx-x64,     artifact: tetrio-es-patcher-macos-x64.zip }
          - { os: macos-14,         rid: osx-arm64,   artifact: tetrio-es-patcher-macos-arm64.zip }
          - { os: ubuntu-latest,    rid: linux-x64,   artifact: tetrio-es-patcher-linux-x64 }
          # Gratis para repos públicos; si el repo es privado, elimina esta fila.
          - { os: ubuntu-24.04-arm, rid: linux-arm64, artifact: tetrio-es-patcher-linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar (self-contained, un solo archivo)
        run: >
          dotnet publish TetrioEsPatcher.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:PublishSingleFile=true -o out

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp out/tetrio-es-patcher.exe "dist/${{ matrix.artifact }}"

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp out/tetrio-es-patcher "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - name: Empaquetar (macOS .app)
        if: runner.os == 'macOS'
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"; [ -z "$VER" ] && VER="1.0.0"
          APP="dist/Traducir TETR.IO.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          sed "s/__VERSION__/$VER/g" build/macos/Info.plist > "$APP/Contents/Info.plist"
          cp out/tetrio-es-patcher "$APP/Contents/MacOS/tetrio-es-patcher"
          chmod +x "$APP/Contents/MacOS/tetrio-es-patcher"
          codesign --force --deep --sign - "$APP" || true
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent "Traducir TETR.IO.app" "${{ matrix.artifact }}" )
          rm -rf "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt

      - name: Archivar "[Sin publicar]" del CHANGELOG.md y generar notas de lanzamiento
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DATE="$(date -u +%Y-%m-%d)"

          # index() en vez de un patron regex: evita pelear con el doble escapado de
          # "[" "]" "." entre el string literal de awk y el motor de regex
          # ("[1.2.3]" se interpretaba como clase de caracteres).
          extract_section() {
            awk -v target="$1" '
              index($0, target) == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' CHANGELOG.md
          }

          # Flujo normal: toma "[Sin publicar]" tal cual, sin pedir que nadie la
          # renombre a mano antes de taguear. Si no hay nada ahi (ya se renombro a
          # mano, o alguien olvido escribir algo), respaldo: busca la seccion que ya
          # coincida con el tag.
          CHANGELOG_SECTION="$(extract_section "## [Sin publicar]")"
          RENAME_NEEDED=1
          if [ -z "$(printf '%s' "$CHANGELOG_SECTION" | tr -d '[:space:]')" ]; then
            CHANGELOG_SECTION="$(extract_section "## [$VERSION]")"
            RENAME_NEEDED=0
          fi

          if [ -z "$(printf '%s' "$CHANGELOG_SECTION" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md no tiene nada en '## [Sin publicar]' ni en '## [$VERSION]'. Las notas de lanzamiento no incluiran registro de cambios."
            CHANGELOG_SECTION="_(sin registro de cambios para esta version en CHANGELOG.md)_"
            RENAME_NEEDED=0
          fi

          if [ "$RENAME_NEEDED" -eq 1 ]; then
            awk -v ver="## [$VERSION] - $DATE" '
              index($0, "## [Sin publicar]") == 1 { print "## [Sin publicar]"; print ""; print ver; next }
              { print }
            ' CHANGELOG.md > /tmp/CHANGELOG.md.new
            mv /tmp/CHANGELOG.md.new CHANGELOG.md
          fi

          envsubst '${REPO} ${TAG}' < .github/release_notes_template.md > /tmp/release_template.md

          # Fuera de dist/ a proposito: dist/* se sube tal cual como binarios
          # adjuntos del release, este archivo es solo el cuerpo del texto.
          awk -v changelog="$CHANGELOG_SECTION" '
            /<!--CHANGELOG-->/ { print changelog; next }
            { print }
          ' /tmp/release_template.md > RELEASE_NOTES.md

      - name: Publicar el CHANGELOG.md archivado en main
        continue-on-error: true
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md sin cambios; nada que archivar."
            exit 0
          fi
          cp CHANGELOG.md /tmp/CHANGELOG.md.archived
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/CHANGELOG.md.archived CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore: archiva el changelog de ${{ github.ref_name }} [skip ci]"
          git push origin main

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
