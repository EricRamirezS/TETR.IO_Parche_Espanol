name: Publicar extensión — Firefox (addons.mozilla.org)

on:
  workflow_dispatch:
  push:
    tags: ['ext-v*']

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    # El dispatch manual siempre corre; el trigger por tag respeta PUBLISH_FIREFOX
    # (Settings -> Secrets and variables -> Actions -> Variables) por si esta
    # tienda todavia no esta lista para publicar en automatico.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PUBLISH_FIREFOX != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar (manifest.json + content.js + icons/)
        run: |
          cd browser-extension
          zip -r ../extension-package.zip manifest.json content.js icons 2>/dev/null || \
          zip -r ../extension-package.zip manifest.json content.js

      - name: Descomprimir para firmar con web-ext
        run: mkdir -p ext-src && unzip -o extension-package.zip -d ext-src

      - name: Firmar y publicar en addons.mozilla.org (listado, público)
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: >
          npx --yes web-ext@latest sign
          --source-dir=ext-src
          --artifacts-dir=firefox-dist
          --channel=listed

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: firefox-dist/*.xpi
          if-no-files-found: warn
